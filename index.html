<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра Волкова</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow-x: hidden;
            padding: 10px;
            box-sizing: border-box;
            transition: background 0.8s ease; 
        }

        body.map-active { background: #1a2226; }

        h1 {
            color: #FFEaa7;
            text-shadow: 2px 2px 0px #d63031, 3px 3px 10px rgba(0,0,0,0.4);
            font-size: 2.8em;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: floatTitle 3s ease-in-out infinite;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .screen {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            max-width: 650px;
            width: 100%;
            text-align: center;
            display: none;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .screen.map-mode {
            max-width: 100vw;
            width: 100%;
            background: transparent;
            box-shadow: none;
            padding: 10px 20px;
        }

        .menu-title {
            color: #2d3436;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 3px solid #0984e3;
            padding-bottom: 5px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            background: linear-gradient(to bottom, #ff7675, #d63031);
            color: white;
            padding: 15px;
            margin: 12px auto;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #b20000, 0 10px 15px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-transform: uppercase;
        }

        .menu-btn.game2 { background: linear-gradient(to bottom, #55efc4, #00b894); box-shadow: 0 6px 0 #008f73; color: #2d3436; }
        .menu-btn.game3 { background: linear-gradient(to bottom, #74b9ff, #0984e3); box-shadow: 0 6px 0 #065b9e; }
        
        .menu-btn:active, .action-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #000 !important; }
        .menu-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .question-text {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #2d3436;
            font-weight: 900;
        }

        .map-mode .question-bar {
            width: 100%;
            max-width: 1400px;
            background: #111416;
            border: 2px solid #27ae60;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 0 auto 20px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-mode .question-text {
            color: #ffffff;
            font-size: 1.8em;
            margin: 0;
            font-weight: 900;
        }

        .map-mode .question-text b { color: #74b9ff; }

        .btn-row { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; width: 100%; }

        .action-btn {
            background: #ffeaa7;
            border: none;
            padding: 12px 25px;
            font-size: 1.3em;
            font-weight: 900;
            color: #2d3436;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #fdcb6e;
            transition: all 0.1s;
        }
        .action-btn.true-btn { background: #55efc4; box-shadow: 0 5px 0 #00b894; color: #2d3436;}
        .action-btn.false-btn { background: #ff7675; box-shadow: 0 5px 0 #d63031; color: white;}

        .feedback {
            font-size: 2em;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .map-wrapper {
            position: relative;
            display: block; 
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            border: 4px solid #ffffff;
            border-radius: 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            aspect-ratio: 1920 / 946; 
            background: #a9d6e5;
            overflow: hidden;
        }

        .real-map-image {
            display: block; 
            width: 100%;
            height: 100%;
            pointer-events: none; 
            object-fit: contain;
        }

        /* ---------------------------------------------------
           ТОЧНЫЕ ИНТЕРАКТИВНЫЕ ЗОНЫ (СДВИНУТЫ ВЛЕВО И РОВНЫЕ)
           --------------------------------------------------- */
        .map-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        .continent-zone {
            fill-opacity: 0.45;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            stroke-width: 10; 
            stroke-linejoin: round;
            stroke-linecap: round;
            mix-blend-mode: multiply;
        }

        .continent-zone:hover {
            fill-opacity: 0.8;
            stroke-opacity: 0.9;
        }

        /* Цвета материков */
        .zone-na { fill: #9b59b6; stroke: #9b59b6; } 
        .zone-sa { fill: #e67e22; stroke: #e67e22; } 
        .zone-eu { fill: #e74c3c; stroke: #e74c3c; } 
        .zone-af { fill: #f1c40f; stroke: #f1c40f; } 
        .zone-au { fill: #3498db; stroke: #3498db; } 
        .zone-an { fill: #bdc3c7; stroke: #bdc3c7; } 

        .back-btn { 
            background: #dfe6e9; 
            box-shadow: 0 4px 0 #b2bec3; 
            margin: 20px auto 0 auto; 
            font-size: 1.1em;
            padding: 10px 25px;
            display: inline-block;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            80% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes popCorrect {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes shakeText {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .confetti-piece {
            position: fixed;
            width: 12px; height: 12px;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <h1 id="main-title">🌍 Гео-Открыватели! 🌍</h1>

    <div id="screen-menu" class="screen active">
        <h2 class="menu-title">Выберите задание</h2>
        <button class="menu-btn" onclick="startGame('agree')">🎤 Диктор: Да / Нет</button>
        <button class="menu-btn game2" onclick="startGame('yesno')">🕵️ Угадай-ка объект</button>
        <button class="menu-btn game3" onclick="startGame('map')">🗺 Покажи на карте!</button>
    </div>

    <div id="screen-game" class="screen">
        <h2 id="game-title" style="color:#ff7675; margin-top: 0; margin-bottom: 10px; font-size: 1.8em; text-transform: uppercase;">Игра</h2>
        
        <div id="game-content" style="width: 100%;"></div>
        
        <div id="feedback" class="feedback"></div>
        <button class="action-btn back-btn" onclick="goToMenu()">🏠 Назад в меню</button>
    </div>

    <script>
        const gamesData = {
            agree: [
                { q: "Правда ли, что Евразия — самый огромный материк на планете?", a: true, info: "Точно! Мы с вами живем именно на нем!" },
                { q: "Правда ли, что в Африке живут белые медведи?", a: false, info: "Конечно нет! Там очень жарко, мишкам там не место." },
                { q: "Правда ли, что Тихий океан — самый большой в мире?", a: true, info: "Да! Он настолько гигантский, что занимает треть всей Земли." },
                { q: "Правда ли, что в Австралии много извергающихся вулканов?", a: false, info: "Ни одного! Это единственный материк без вулканов." }
            ],
            yesno: [
                { 
                    hints: "1. Я материк? (Да)<br>2. Я нахожусь на самом юге? (Да)<br>3. У меня много льда и пингвинов? (Да)", 
                    options: ["Африка", "Антарктида", "Евразия"], 
                    ans: "Антарктида" 
                },
                { 
                    hints: "1. Мы горы? (Да)<br>2. Мы находимся в России? (Нет)<br>3. Мы самые-самые высокие в мире? (Да)", 
                    options: ["Уральские горы", "Кавказ", "Гималаи"], 
                    ans: "Гималаи" 
                }
            ],
            map: [
                { task: "Найди самый жаркий материк — <b>Африку!</b>", targetId: "pin-af" },
                { task: "Где находится ледяная <b>Антарктида!</b>", targetId: "pin-an" },
                { task: "Покажи наш огромный материк — <b>Евразию!</b>", targetId: "pin-eu" },
                { task: "А где живет кенгуру? Найди <b>Австралию!</b>", targetId: "pin-au" }
            ]
        };

        let currentGame = '';
        let currentStep = 0;

        function shootConfetti() {
            const colors = ['#ff7675', '#55efc4', '#0984e3', '#fdcb6e', '#e84393', '#00b894'];
            for(let i = 0; i < 100; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti-piece';
                conf.style.left = '50vw';
                conf.style.top = '80vh';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(conf);

                let angle = Math.random() * Math.PI * 2;
                let velocity = 15 + Math.random() * 30;
                let vx = Math.cos(angle) * velocity;
                let vy = Math.sin(angle) * velocity - 30; 
                let rot = 0;
                
                let animate = setInterval(() => {
                    let top = parseFloat(conf.style.top);
                    let left = parseFloat(conf.style.left);
                    vy += 0.8; 
                    conf.style.top = (top + vy/5) + 'vh';
                    conf.style.left = (left + vx/5) + 'vw';
                    rot += 15;
                    conf.style.transform = `rotate(${rot}deg) scale(${1 - top/250})`;
                    if(top > 120) { clearInterval(animate); conf.remove(); }
                }, 20);
            }
        }

        function playSound(isCorrect) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if(isCorrect) {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(500, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.3);
                } else {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
                }
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
                osc.stop(ctx.currentTime + 0.6);
            } catch(e) {}
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('feedback').innerHTML = '';
        }

        function goToMenu() { 
            document.body.classList.remove('map-active');
            document.getElementById('screen-game').classList.remove('map-mode');
            document.getElementById('main-title').style.display = 'block';
            showScreen('screen-menu'); 
        }

        function startGame(type) {
            currentGame = type;
            currentStep = 0;
            
            if (type === 'map') {
                document.body.classList.add('map-active');
                document.getElementById('screen-game').classList.add('map-mode');
                document.getElementById('main-title').style.display = 'none';
            } else {
                document.body.classList.remove('map-active');
                document.getElementById('screen-game').classList.remove('map-mode');
                document.getElementById('main-title').style.display = 'block';
            }
            showScreen('screen-game');
            renderStep();
        }

        function renderStep() {
            const contentDiv = document.getElementById('game-content');
            const title = document.getElementById('game-title');
            document.getElementById('feedback').innerHTML = '';
            
            let data = gamesData[currentGame];
            if (currentStep >= data.length) {
                contentDiv.innerHTML = `<h2 style="color:#00e676; font-size: 3.5em; margin: 30px 0; text-shadow: 2px 2px 0px #fff;">🎉 ТЫ СУПЕР! ИГРА ПРОЙДЕНА! 🎉</h2>`;
                shootConfetti();
                setTimeout(shootConfetti, 500); 
                playSound(true);
                return;
            }

            const item = data[currentStep];

            if (currentGame === 'agree') {
                title.innerText = "Правда или Ложь?";
                contentDiv.innerHTML = `
                    <div class="question-text">Вопрос ${currentStep + 1}:<br><b>${item.q}</b></div>
                    <div class="btn-row">
                        <button class="action-btn true-btn" onclick="checkAgree(true)">👍 Правда!</button>
                        <button class="action-btn false-btn" onclick="checkAgree(false)">👎 Неправда!</button>
                    </div>
                `;
            } 
            else if (currentGame === 'yesno') {
                title.innerText = "Угадай-ка!";
                let btns = item.options.map(o => `<button class="action-btn" onclick="checkYesNo('${o}')">${o}</button>`).join('');
                contentDiv.innerHTML = `
                    <div class="question-text" style="text-align: left; background: #f1f2f6; padding: 25px; border-radius: 15px; box-shadow: inset 0 5px 15px rgba(0,0,0,0.1); margin: 0 auto 20px auto; max-width: 550px;">
                        <b style="color: #0984e3;">Факты о секретном объекте:</b><br><br>${item.hints}
                    </div>
                    <h3 style="color:#2d3436; font-size: 1.8em; margin: 15px 0;">Так кто же я? Выбирай:</h3>
                    <div class="btn-row">${btns}</div>
                `;
            }
            else if (currentGame === 'map') {
                title.style.display = 'none'; 
                
                /* 
                   СДВИНУТЫЕ ВЛЕВО И СТРОГО ВЫВЕРЕННЫЕ ЗОНЫ
                */
                contentDiv.innerHTML = `
                    <div class="question-bar">
                        <div class="question-text">${item.task}</div>
                    </div>
                    
                    <div class="map-wrapper">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/A_large_blank_world_map_with_oceans_marked_in_blue.svg/1920px-A_large_blank_world_map_with_oceans_marked_in_blue.svg.png" 
                             class="real-map-image" alt="Карта мира">
                        
                        <svg class="map-overlay" viewBox="0 0 1920 946" preserveAspectRatio="xMidYMid meet">
                            
                            <!-- Северная Америка (сдвинута левее) -->
                            <polygon class="continent-zone zone-na" 
                                     points="50,140 160,40 350,10 550,10 700,50 780,150 750,280 620,380 480,420 380,420 320,350 220,300 120,250 80,180" 
                                     onclick="checkMap('pin-na')"/>
                                     
                            <!-- Южная Америка -->
                            <polygon class="continent-zone zone-sa" 
                                     points="360,430 460,430 550,480 620,580 580,720 500,820 440,820 410,720 360,580" 
                                     onclick="checkMap('pin-sa')"/>
                                     
                            <!-- Евразия (сдвинута левее) -->
                            <polygon class="continent-zone zone-eu" 
                                     points="780,160 800,70 1050,20 1350,20 1650,30 1800,60 1800,240 1700,340 1550,380 1450,420 1350,420 1250,400 1100,350 950,310 800,280" 
                                     onclick="checkMap('pin-eu')"/>
                                     
                            <!-- Африка -->
                            <polygon class="continent-zone zone-af" 
                                     points="780,300 920,320 1010,350 1100,400 1200,450 1150,600 1050,730 900,730 820,580 780,440" 
                                     onclick="checkMap('pin-af')"/>
                                     
                            <!-- Австралия -->
                            <polygon class="continent-zone zone-au" 
                                     points="1300,550 1550,510 1750,520 1850,650 1800,820 1550,820 1350,750 1280,650" 
                                     onclick="checkMap('pin-au')"/>
                                     
                            <!-- Антарктида (аккуратный полукруг снизу) -->
                            <path class="continent-zone zone-an" 
                                  d="M 50,860 Q 500,830 960,820 Q 1420,830 1870,860 L 1920,946 L 0,946 Z" 
                                  onclick="checkMap('pin-an')"/>
                                     
                        </svg>
                    </div>
                `;
            }
        }

        function showResult(isCorrect, text) {
            const fb = document.getElementById('feedback');
            if (isCorrect) {
                playSound(true);
                shootConfetti(); 
                fb.innerHTML = `<div style="color:#00e676; animation: popCorrect 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">✅ ${text}</div>`;
                
                setTimeout(() => { 
                    currentStep++; 
                    if(currentGame === 'map') document.getElementById('game-title').style.display = 'none';
                    else document.getElementById('game-title').style.display = 'block';
                    renderStep(); 
                }, 2500); 
            } else {
                playSound(false);
                fb.innerHTML = `<div style="color:#ff4757; animation: shakeText 0.4s;">❌ Ой-ой! Попробуй еще раз!</div>`;
            }
        }

        function checkAgree(answer) {
            let item = gamesData.agree[currentStep];
            showResult(answer === item.a, item.info);
        }

        function checkYesNo(answer) {
            let item = gamesData.yesno[currentStep];
            showResult(answer === item.ans, "Ты настоящий гео-сыщик!");
        }

        function checkMap(clickedZone) {
            let item = gamesData.map[currentStep];
            showResult(clickedZone === item.targetId, "В яблочко! Идеальное знание карты!");
        }
    </script>
</body>
</html>
